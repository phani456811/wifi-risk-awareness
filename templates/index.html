<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wi-Fi Risk Awareness</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background: url("{{ url_for('static', filename='images/wifi-bg.jpg') }}");
            background-size: cover;
            background-repeat: no-repeat;
        }

        .overlay {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card shadow overlay">
        <div class="card-body">

            <h2 class="text-center mb-3">
                Wi-Fi Risk Awareness Assessment
            </h2>

            <p class="text-center text-muted mb-4">
                Answer a few questions below to get an awareness-based Wi-Fi risk Assessment
            </p>

            <form method="post" action="/assess">

                <div class="mb-3">
                    <label class="form-label">Is the Wi-Fi public?</label>
                    <select class="form-select" name="public_wifi" required>
                        <option value="">Select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Is the Wi-Fi password protected?</label>
                    <select class="form-select" name="password_protected" required>
                        <option value="">Select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Do staff and customers share the same network?</label>
                    <select class="form-select" name="shared_network" required>
                        <option value="">Select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Router age</label>
                    <select class="form-select" name="router_age" required>
                        <option value="">Select</option>
                        <option value="newer_than_2_years">Newer than 2 years</option>
                        <option value="between_2_and_5_years">Between 2 and 5 years</option>
                        <option value="older_than_5_years">Older than 5 years</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Assess Wi-Fi Risk
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
